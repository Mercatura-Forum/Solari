# Deployment manifest. Replace every placeholder with your own network before deploying;
# the values are yours, not this repository's.
[project]
name = "solari"
default_network = "wan"
chain_id = 0                       # your network's chain id

[networks.wan]
# one entry per validator of the network you deploy to
validators = ["https://<validator>/deploy-api"]
boundary = "https://<thebes-gateway>"
routing = "smart"

[canisters.audit]
type = "backend-motoko"
cid = "auto"                      # or the id of the contract you deploy onto
identity = "<your-identity>"
wasm = "build/audit.wasm"
build = "cd motoko && ${MOC:-moc} --legacy-persistence $(mops sources) -o ../build/audit.wasm main.mo"

[canisters.web]
type = "frontend"
cid = "auto"                      # or the id of the contract you deploy onto
identity = "<your-identity>"
wasm = "asset_canister.wasm"
bundle = "frontend/dist"
health_check_url = "/index.html"
