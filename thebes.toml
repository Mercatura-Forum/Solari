[project]
name = "solari"
default_network = "wan"
chain_id = 2026

[networks.wan]
gateway = "https://memphis.mercaturaforum.com"
validators = [
    "https://memphis.mercaturaforum.com/deploy-api/v0",
    "https://memphis.mercaturaforum.com/deploy-api/v1",
    "https://memphis.mercaturaforum.com/deploy-api/v2",
    "https://memphis.mercaturaforum.com/deploy-api/v3",
]
boundary = "https://memphis.mercaturaforum.com"
routing = "smart"

[canisters.audit]
type = "backend-motoko"
cid = "auto"
wasm = "build/audit.wasm"
source = "motoko/main.mo"
build = "cd motoko && ${MOC:-moc} --legacy-persistence $(mops sources) -o ../build/audit.wasm main.mo"
init = "()"

[canisters.web]
type = "frontend"
cid = "auto"
wasm = "asset_canister.wasm"
bundle = "frontend/dist"
health_check_url = "/index.html"
